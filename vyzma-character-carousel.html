<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vyzma AI Character Carousel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      :root {
        --accent: #0066ff;
        --panel-bg: rgba(8, 10, 18, 0.56);
        --white-soft: rgba(255, 255, 255, 0.78);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #03050a;
        color: #ffffff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        isolation: isolate;
      }

      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #03050a;
      }

      .scanlines {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        background:
          linear-gradient(
            rgba(255, 255, 255, 0.035) 50%,
            rgba(0, 0, 0, 0.08) 50%
          )
          0 0 / 100% 4px;
        mix-blend-mode: overlay;
        opacity: 0.48;
      }

      .vignette {
        position: absolute;
        inset: 0;
        z-index: 19;
        pointer-events: none;
        background:
          radial-gradient(circle at 35% 50%, transparent 0 34%, rgba(0, 0, 0, 0.14) 56%, rgba(0, 0, 0, 0.82) 100%),
          linear-gradient(90deg, rgba(0, 0, 0, 0.32), rgba(0, 0, 0, 0.06) 48%, rgba(0, 0, 0, 0.78));
      }

      .logo {
        position: absolute;
        top: 28px;
        left: 34px;
        z-index: 30;
        width: clamp(112px, 9vw, 156px);
        height: auto;
        filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.5));
      }

      .visual-zone {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .bg-layer {
        position: absolute;
        inset: 0;
        background-position: center;
        background-size: cover;
        opacity: 0;
        transform: scale(1);
        will-change: opacity, transform;
      }

      .bg-layer.active {
        opacity: 1;
      }

      .bg-layer::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.05) 48%, rgba(0, 0, 0, 0.7)),
          radial-gradient(circle at 35% 48%, color-mix(in srgb, var(--accent) 16%, transparent), rgba(0, 0, 0, 0.44) 74%);
      }

      .particle-field {
        position: absolute;
        inset: 0;
        z-index: 7;
        overflow: hidden;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 18px var(--accent);
        opacity: 0.42;
      }

      .character-area {
        position: absolute;
        inset: 0;
        z-index: 12;
        display: grid;
        place-items: center;
        perspective: 1200px;
        overflow: hidden;
      }

      .character-wrap {
        position: absolute;
        left: 45%;
        bottom: 0;
        width: min(34vw, calc(100vw - 430px - 80px - 22vw));
        height: 85vh;
        display: grid;
        place-items: end center;
        will-change: transform, opacity;
      }

      .character-wrap.previous {
        left: 3.8%;
        bottom: 9vh;
        width: min(12vw, 170px);
        height: 25vh;
        opacity: 0.2;
        filter: grayscale(0.25) blur(2.2px);
        z-index: 1;
        cursor: pointer;
      }

      .character-wrap.next {
        left: 61%;
        bottom: 10vh;
        width: min(13vw, 210px);
        height: 34vh;
        opacity: 0.14;
        filter: grayscale(0.2) blur(0.6px);
        z-index: 1;
      }

      .character {
        width: auto;
        height: 100%;
        max-width: none;
        max-height: 100%;
        object-fit: contain;
        object-position: center bottom;
        filter:
          drop-shadow(0 0 26px color-mix(in srgb, var(--accent) 62%, transparent))
          drop-shadow(0 32px 34px rgba(0, 0, 0, 0.56));
        transform-origin: center bottom;
        user-select: none;
        pointer-events: none;
      }

      .floor-glow {
        position: absolute;
        left: 45%;
        bottom: 1.8vh;
        width: min(26vw, 430px);
        height: 52px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(ellipse, var(--accent) 0%, transparent 68%);
        opacity: 0.36;
        filter: blur(18px);
      }

      .panel-shell {
        position: absolute;
        top: 50%;
        right: 2.7vw;
        z-index: 25;
        width: min(27vw, 480px);
        min-width: 430px;
        transform: translateY(-50%);
      }

      .info-panel {
        position: relative;
        min-height: 500px;
        padding: 32px;
        border: 1px solid color-mix(in srgb, var(--accent) 72%, transparent);
        border-radius: 26px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.035)),
          var(--panel-bg);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.055) inset,
          0 0 42px color-mix(in srgb, var(--accent) 30%, transparent),
          0 24px 70px rgba(0, 0, 0, 0.54);
        backdrop-filter: blur(22px) saturate(150%);
        overflow: hidden;
      }

      .info-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background:
          radial-gradient(circle at 22% 0%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 34%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent 32%);
        opacity: 0.8;
      }

      .panel-content {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .kicker {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        gap: 10px;
        margin-bottom: 30px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .kicker::before {
        content: "";
        width: 38px;
        height: 2px;
        background: var(--accent);
        box-shadow: 0 0 20px var(--accent);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(34px, 3vw, 50px);
        line-height: 0.96;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .tagline {
        margin: 0 0 22px;
        color: var(--accent);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .description {
        margin: 0 0 28px;
        color: var(--white-soft);
        font-size: 15px;
        line-height: 1.65;
      }

      .features {
        margin: 0 0 32px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 11px;
        overflow-wrap: anywhere;
        font-weight: 800;
        line-height: 1.6;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 154px;
        height: 48px;
        margin-top: auto;
        border: 1px solid color-mix(in srgb, var(--accent) 68%, white 8%);
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, white));
        color: #fff;
        text-decoration: none;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        box-shadow:
          0 0 24px color-mix(in srgb, var(--accent) 52%, transparent),
          0 14px 26px rgba(0, 0, 0, 0.36);
        transition:
          transform 220ms ease,
          box-shadow 220ms ease;
      }

      .cta:hover {
        transform: translateY(-2px);
        box-shadow:
          0 0 34px color-mix(in srgb, var(--accent) 66%, transparent),
          0 18px 30px rgba(0, 0, 0, 0.44);
      }

      .nav-stack {
        position: absolute;
        left: 66px;
        top: 50%;
        z-index: 35;
        transform: translateY(-50%);
        display: grid;
        gap: 14px;
      }

      .nav-button {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
        border-radius: 999px;
        background: rgba(5, 8, 16, 0.46);
        color: #fff;
        cursor: pointer;
        backdrop-filter: blur(16px);
        box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 22%, transparent);
        transition:
          background 220ms ease,
          border-color 220ms ease,
          transform 220ms ease;
      }

      .nav-button:hover {
        background: color-mix(in srgb, var(--accent) 28%, rgba(5, 8, 16, 0.58));
      }

      .nav-button:active {
        transform: scale(0.94);
      }

      .nav-button svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2.4;
        fill: none;
      }

      .counter {
        position: absolute;
        left: 50%;
        bottom: 24px;
        z-index: 36;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 14px;
        color: rgba(255, 255, 255, 0.92);
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.24em;
      }

      .counter::before,
      .counter::after {
        content: "";
        width: 46px;
        height: 1px;
        background: var(--accent);
        box-shadow: 0 0 16px var(--accent);
      }

      @media (max-width: 1100px) {
        .panel-shell {
          right: 3vw;
          width: 32vw;
          min-width: 360px;
        }

        .info-panel {
          min-height: 520px;
          padding: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Vyzma AI game-style service carousel">
      <div class="visual-zone" aria-hidden="true">
        <div class="bg-layer active" id="bgA"></div>
        <div class="bg-layer" id="bgB"></div>
      </div>

      <div class="particle-field" id="particles" aria-hidden="true"></div>

      <img class="logo" id="logo" alt="Vyzma AI" />

      <section class="character-area" aria-live="polite">
        <div class="floor-glow" id="floorGlow"></div>
        <div class="character-wrap previous" id="previousWrap" role="button" tabindex="0" aria-label="Previous character">
          <img class="character" id="previousCharacter" alt="" />
        </div>
        <div class="character-wrap" id="currentWrap">
          <img class="character" id="currentCharacter" alt="" />
        </div>
        <div class="character-wrap next" id="nextWrap">
          <img class="character" id="nextCharacter" alt="" />
        </div>
      </section>

      <aside class="panel-shell" id="panelShell">
        <div class="info-panel">
          <div class="panel-content" id="panelContent">
            <span class="kicker" id="kicker">Vyzma Service</span>
            <h1 id="slideName">AI CHATBOT</h1>
            <p class="tagline" id="tagline">Always On. Always Smart.</p>
            <p class="description" id="description"></p>
            <p class="features" id="features"></p>
            <a class="cta" id="cta" href="https://vyzma.in">Get Started &#8594;</a>
          </div>
        </div>
      </aside>

      <div class="nav-stack" aria-label="Carousel controls">
        <button class="nav-button left" id="prevBtn" type="button" aria-label="Previous character">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <button class="nav-button right" id="nextBtn" type="button" aria-label="Next character">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" />
          </svg>
        </button>
      </div>

      <div class="counter" id="counter">01/05</div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>
    </main>

    <script>
      const slides = [
        {
          accent: "#0066FF",
          name: "AI CHATBOT",
          tagline: "Always On. Always Smart.",
          description:
            "Deploy intelligent chatbots that handle customer queries 24/7, qualify leads automatically and never miss a conversation.",
          features: "Instant Replies · Lead Qualification · 24/7 Support",
          background: "C:\\Users\\user\\Downloads\\chat bot back ground.png",
          character: "C:\\claude code\\new vyzma\\public\\carousel-final\\wolf-1.png",
        },
        {
          accent: "#8B00FF",
          name: "VOICE AGENT",
          tagline: "Your Brand. Your Voice.",
          description:
            "AI-powered voice agents that listen, think and respond naturally — handling calls without any human effort.",
          features: "Natural Conversations · Real-time Response · Multi-language",
          background: "C:\\Users\\user\\Downloads\\voice agent back ground.png",
          character: "C:\\claude code\\new vyzma\\public\\carousel-final\\wolf-2.png",
        },
        {
          accent: "#FF2200",
          name: "AI FILMMAKING",
          tagline: "Create Without Limits.",
          description:
            "Generate cinematic videos, scripts and visual content powered by AI — faster and cheaper than traditional production.",
          features: "AI Video Generation · Script Writing · Cinematic Quality",
          background: "C:\\Users\\user\\Downloads\\ai film making background.png",
          character: "C:\\claude code\\new vyzma\\public\\carousel-final\\wolf-3.png",
        },
        {
          accent: "#00FFCC",
          name: "WEBSITE DESIGN",
          tagline: "Design That Converts.",
          description:
            "Modern fast and conversion-focused websites built with AI-assisted design — ready to rank and grow.",
          features: "AI-Assisted Design · SEO Ready · Mobile First",
          background: "C:\\Users\\user\\Downloads\\website background.png",
          character: "C:\\claude code\\new vyzma\\public\\carousel-final\\wolf-4.png",
        },
        {
          accent: "#FFB800",
          name: "DIGITAL MARKETING",
          tagline: "Grow Faster. Scale Smarter.",
          description:
            "Data-driven marketing strategies powered by AI — reach the right audience at the right time every time.",
          features: "AI Targeting · Analytics · ROI Focused",
          background: "C:\\Users\\user\\Downloads\\digital markting back ground.png",
          character: "C:\\claude code\\new vyzma\\public\\carousel-final\\wolf-5.png",
        },
      ];

      const logoPath = "C:\\Users\\user\\Downloads\\vyzma_logo_png.png";
      const duration = 0.8;
      const ease = "power3.inOut";

      const root = document.documentElement;
      const bgA = document.getElementById("bgA");
      const bgB = document.getElementById("bgB");
      const currentWrap = document.getElementById("currentWrap");
      const currentCharacter = document.getElementById("currentCharacter");
      const previousCharacter = document.getElementById("previousCharacter");
      const nextCharacter = document.getElementById("nextCharacter");
      const panelShell = document.getElementById("panelShell");
      const panelContent = document.getElementById("panelContent");
      const counter = document.getElementById("counter");
      const particles = document.getElementById("particles");
      const logo = document.getElementById("logo");

      let activeIndex = 0;
      let showingA = true;
      let isAnimating = false;
      let floatTween;
      let kenBurnsTween;

      const windowsPathToFileUrl = (path) =>
        `file:///${path.replace(/\\/g, "/").replace(/^([A-Za-z]):/, "$1:").replace(/ /g, "%20")}`;

      function setImage(element, path) {
        element.src = windowsPathToFileUrl(path);
      }

      function setBackground(element, path) {
        element.style.backgroundImage = `url("${windowsPathToFileUrl(path)}")`;
      }

      function updatePanel(slide) {
        document.getElementById("slideName").textContent = slide.name;
        document.getElementById("tagline").textContent = slide.tagline;
        document.getElementById("description").textContent = slide.description;
        document.getElementById("features").textContent = slide.features;
        document.getElementById("kicker").textContent = "Vyzma Service";
        document.getElementById("cta").href = "https://vyzma.in";
      }

      function updateCounter() {
        counter.textContent = `${String(activeIndex + 1).padStart(2, "0")}/${String(slides.length).padStart(2, "0")}`;
      }

      function updateSideCharacters(index) {
        const previousIndex = (index - 1 + slides.length) % slides.length;
        const nextIndex = (index + 1) % slides.length;
        setImage(previousCharacter, slides[previousIndex].character);
        setImage(nextCharacter, slides[nextIndex].character);
      }

      function createParticles() {
        particles.innerHTML = "";
        for (let i = 0; i < 34; i += 1) {
          const particle = document.createElement("span");
          particle.className = "particle";
          particles.appendChild(particle);
          gsap.set(particle, {
            x: `${gsap.utils.random(4, 94)}vw`,
            y: `${gsap.utils.random(6, 92)}vh`,
            scale: gsap.utils.random(0.45, 1.7),
            opacity: gsap.utils.random(0.16, 0.48),
          });
          gsap.to(particle, {
            y: `-=${gsap.utils.random(28, 96)}`,
            x: `+=${gsap.utils.random(-36, 36)}`,
            opacity: gsap.utils.random(0.22, 0.62),
            duration: gsap.utils.random(3.2, 7.4),
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut",
            delay: gsap.utils.random(0, 2),
          });
        }
      }

      function startFloat() {
        if (floatTween) floatTween.kill();
        floatTween = gsap.to(currentWrap, {
          y: -24,
          rotation: 1,
          duration: 1.5,
          repeat: -1,
          yoyo: true,
          ease: "sine.inOut",
        });
      }

      function startKenBurns(layer) {
        if (kenBurnsTween) kenBurnsTween.kill();
        gsap.set(layer, { scale: 1 });
        kenBurnsTween = gsap.to(layer, {
          scale: 1.1,
          duration: 13,
          ease: "sine.inOut",
        });
      }

      function activeBgLayer() {
        return showingA ? bgA : bgB;
      }

      function inactiveBgLayer() {
        return showingA ? bgB : bgA;
      }

      function goTo(nextIndex) {
        if (isAnimating || nextIndex === activeIndex) return;
        isAnimating = true;

        const oldIndex = activeIndex;
        const slide = slides[nextIndex];
        const nextBg = inactiveBgLayer();
        const oldBg = activeBgLayer();

        setBackground(nextBg, slide.background);
        setImage(currentCharacter, slide.character);
        updateSideCharacters(nextIndex);

        root.style.setProperty("--accent", slide.accent);
        updatePanel(slide);

        gsap.killTweensOf([currentWrap, panelShell, panelContent, oldBg, nextBg]);
        if (floatTween) floatTween.kill();

        gsap.set(currentWrap, {
          xPercent: 42,
          y: 20,
          rotationY: -24,
          rotation: -1,
          scale: 0.74,
          opacity: 0,
        });
        gsap.set(nextBg, { opacity: 0, scale: 1.04 });
        gsap.set(panelShell, { x: 70 });

        const timeline = gsap.timeline({
          defaults: { duration, ease },
          onComplete: () => {
            oldBg.classList.remove("active");
            nextBg.classList.add("active");
            showingA = !showingA;
            activeIndex = nextIndex;
            updateCounter();
            startFloat();
            startKenBurns(nextBg);
            isAnimating = false;
          },
        });

        timeline
          .to(panelContent, { opacity: 0, y: 16, duration: 0.28, ease: "power2.in" }, 0)
          .to(oldBg, { opacity: 0 }, 0)
          .to(nextBg, { opacity: 1, scale: 1 }, 0)
          .fromTo(
            currentWrap,
            {
              xPercent: 42,
              y: 20,
              rotationY: -24,
              rotation: -1,
              scale: 0.74,
              opacity: 0,
            },
            {
              xPercent: -50,
              y: 0,
              rotationY: 0,
              rotation: 0,
              scale: 1,
              opacity: 1,
            },
            0.08,
          )
          .fromTo(
            "#previousWrap",
            { xPercent: 44, opacity: 0 },
            { xPercent: -50, opacity: 0.2 },
            0.18,
          )
          .fromTo(
            "#nextWrap",
            { xPercent: -36, opacity: 0 },
            { xPercent: -50, opacity: 0.14 },
            0.18,
          )
          .to(panelShell, { x: 0 }, 0.25)
          .to(panelContent, { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" }, 0.46);
      }

      function next() {
        goTo((activeIndex + 1) % slides.length);
      }

      function prev() {
        goTo((activeIndex - 1 + slides.length) % slides.length);
      }

      function init() {
        const first = slides[0];
        logo.src = windowsPathToFileUrl(logoPath);
        setBackground(bgA, first.background);
        setImage(currentCharacter, first.character);
        updateSideCharacters(0);
        root.style.setProperty("--accent", first.accent);
        updatePanel(first);
        updateCounter();
        createParticles();
        gsap.set([currentWrap, "#previousWrap", "#nextWrap"], { xPercent: -50 });
        startFloat();
        startKenBurns(bgA);

        gsap.from(panelShell, {
          x: 90,
          opacity: 0,
          duration: 0.9,
          ease: "power3.out",
          delay: 0.15,
        });
        gsap.from(currentWrap, {
          xPercent: -8,
          rotationY: -18,
          scale: 0.82,
          opacity: 0,
          duration: 1,
          ease: "power3.out",
        });
      }

      document.getElementById("nextBtn").addEventListener("click", next);
      document.getElementById("prevBtn").addEventListener("click", prev);
      document.getElementById("previousWrap").addEventListener("click", prev);
      document.getElementById("previousWrap").addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          prev();
        }
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") next();
        if (event.key === "ArrowLeft") prev();
      });

      window.addEventListener("load", init);
    </script>
  </body>
</html>
